<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emotion Detector</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
  <div class="container mt-5">
    <h1>Emotion Detector</h1>
    <div class="form-group">
      <label for="textToAnalyze">Enter text to analyze:</label>
      <textarea class="form-control" id="textToAnalyze" rows="4"></textarea>
    </div>
    <button type="button" class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Emotion Detection</button>
    <div id="system_response" class="mt-4"></div>
  </div>
</body>
</html>
